#AndroidIDE: enforce UTF-8 & locale for Gradle daemon
#Fri May 29 09:48:44 GMT 2026
android.suppressUnsupportedCompileSdk=37
android.nonTransitiveRClass=true
kotlin.code.style=official
systemProp.user.language=en
systemProp.user.country=US
systemProp.sun.jnu.encoding=UTF-8
systemProp.file.encoding=UTF-8
# 实测于 11 GB 设备(静息可用 ~3 GB、ZRAM 8 GB 已用 5 GB、swappiness=150、
# overcommit_memory=1)。全量重编会并发跑两个 JVM，实测峰值:
#   GradleDaemon        1955-2062 MB
#   KotlinCompileDaemon 1340 MB(未加上限时)
# Kotlin 守护进程原本没有任何堆上限，是两者中唯一未设界的一份，故在此设界。
# overcommit_memory=1 会让超额分配先成功、之后才崩，不能指望分配失败来兜底。
#
# org.gradle.jvmargs 保持 2048m:实测把它降到 1536m 时 GradleDaemon 的 RSS 反而
# 略微上升，因为其占用主要来自 metaspace、code cache、线程栈和 AAPT2/dexer 的
# native 分配，都不受 -Xmx 约束。降堆没有收益，却会增加 Java 堆 OOM 的风险。
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding\=UTF-8
kotlin.daemon.jvmargs=-Xmx1024m
android.useAndroidX=true
android.enableResourceOptimizations=false
android.aapt2FromMavenOverride=/data/data/com.tom.rv2ide/files/home/android-sdk/build-tools/35.0.1/aapt2
